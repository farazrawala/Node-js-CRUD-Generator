# Apache vhost — proxy /pos_admin to Node (replaces slow .htaccess [P] rewrite proxy)
#
# Your test proved:
#   curl http://127.0.0.1:8000/api/health          → ~0.01s  (Node OK)
#   curl https://…/pos_admin/api/health via Apache → ~58s   (proxy broken)
#
# Install (as root on ded4240):
#   cp deploy/apache-pos-admin-vhost.conf /etc/apache2/conf.d/pos_admin_proxy.conf
#   # or include from the site's SSL vhost — see README below
#   apachectl configtest && systemctl reload httpd
#
# Then use deploy/pos_admin.htaccess (no [P] proxy line) in public_html/pos_admin/

<IfModule mod_proxy.c>
  ProxyPreserveHost On
  ProxyRequests Off

  # Keep backend connections warm (requires mod_proxy_http)
  <Proxy http://127.0.0.1:8000/pos_admin>
    ProxySet connectiontimeout=5 timeout=300 ttl=60 keepalive=On
  </Proxy>

  # API + admin HTML → Node (PM2 pos_admin on PORT=8000)
  ProxyPass        /pos_admin/ http://127.0.0.1:8000/pos_admin/ nocanon
  ProxyPassReverse /pos_admin/ http://127.0.0.1:8000/pos_admin/

  # Static uploads from disk (faster than Node; matches .htaccess behaviour)
  Alias /pos_admin/uploads /home/demowebsitv3/public_html/pos_admin/uploads
  <Directory /home/demowebsitv3/public_html/pos_admin/uploads>
    Require all granted
    Options -Indexes
  </Directory>
</IfModule>

# If ModSecurity adds 10–60s per request, whitelist the API (path varies by host):
# SecRuleEngine Off
# — or in cPanel/WAF: disable for /pos_admin/api/*
