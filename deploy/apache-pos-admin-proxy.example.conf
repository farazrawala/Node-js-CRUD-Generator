# Apache: proxy /pos_admin to Node — use deploy/apache-pos-admin-vhost.conf (full fix).
# This minimal snippet is for reference only; prefer the vhost file with keepalive + uploads Alias.
#
# In .env on the server:
#   BASE_PATH=/pos_admin
#   BASE_URL=https://testv3.websitedemolynk.com/pos_admin
#   PORT=8000
#   NODE_ENV=production
#   APP_ENV=live
#   MONGODB_URI_LIVE=mongodb://user:pass@127.0.0.1:27017/pos_db?authSource=admin  # same server: use 127.0.0.1 not public IP

<Location /pos_admin>
    ProxyPreserveHost On
    ProxyPass http://127.0.0.1:8000/pos_admin connectiontimeout=5 timeout=300
    ProxyPassReverse http://127.0.0.1:8000/pos_admin
</Location>

# Do NOT serve index.js as a static file under public_html/pos_admin.
# Run Node with PM2: pm2 start index.js --name pos-api
