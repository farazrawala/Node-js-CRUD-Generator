name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    environment: SSH_PRIVATE_KEY
    name: deploy
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Verify production dependencies install (not uploaded — symlinks break FTP)
        run: |
          npm ci --omit=dev
          node -e "require('iconv-lite').encodingExists('utf8')"
          NODE_ENV=production node -e "require('./utils/monitoring').initMonitoring(); console.log('monitoring init ok')"
          echo "npm ci OK ($(du -sh node_modules | cut -f1))"

      - name: Bump deploy version (MAJOR.MINOR.<run#> on every push)
        id: bump_version
        run: |
          DEPLOY_VERSION="$(node deploy/bump-deploy-version.js)"
          echo "deployVersion=${DEPLOY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Deploy version: ${DEPLOY_VERSION}"

      - name: Write deploy build-info (version stamp for /health and /api/version)
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > deploy/build-info.json <<EOF
          {
            "deployVersion": "${{ steps.bump_version.outputs.deployVersion }}",
            "deployNumber": ${GITHUB_RUN_NUMBER},
            "gitCommit": "${GITHUB_SHA}",
            "gitCommitShort": "${SHORT}",
            "gitBranch": "${GITHUB_REF_NAME}",
            "deployedAt": "${DEPLOYED_AT}",
            "buildLabel": "v${{ steps.bump_version.outputs.deployVersion }}-${SHORT}",
            "workflowRunId": "${GITHUB_RUN_ID}"
          }
          EOF
          echo "Build stamp:"
          cat deploy/build-info.json

      - name: Sync application files (exclude node_modules — server runs npm ci on restart)
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: 192.249.118.80
          username: pos_admin@testv3.websitedemolynk.com
          password: ${{ secrets.FTP_PASSWORD }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules
            **/uploads/**
            **/uploads
            **/logs/**
            **/logs
            deploy/github_actions_key.pem
            deploy/github_actions_key.pem.example

      - name: Restart pos_admin on server (HTTPS deploy hook)
        id: restart
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://testv3.websitedemolynk.com/pos_admin' }}
          DEPLOY_RESTART_TOKEN: ${{ secrets.DEPLOY_RESTART_TOKEN }}
        run: |
          if [ -z "$DEPLOY_RESTART_TOKEN" ]; then
            echo "::error::Missing repo secret DEPLOY_RESTART_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "requestedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          CODE=$(curl -sS -m 30 -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DEPLOY_RESTART_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"commit\":\"${GITHUB_SHA}\",\"run\":${GITHUB_RUN_NUMBER}}" \
            "${API_BASE}/api/deploy/restart" || echo "000")
          echo "HTTP ${CODE}"; cat resp.json 2>/dev/null; echo
          case "$CODE" in
            202) echo "✅ Restart accepted." ;;
            401) echo "::error::Token rejected — DEPLOY_RESTART_TOKEN in GitHub must match the one in the server .env."; exit 1 ;;
            404) echo "::error::Deploy hook not active — set DEPLOY_RESTART_TOKEN in the server .env and run 'pm2 restart pos_admin' once."; exit 1 ;;
            *) echo "::error::Restart call failed (HTTP ${CODE})."; exit 1 ;;
          esac

      - name: Verify new code is running (/health)
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://testv3.websitedemolynk.com/pos_admin' }}
          REQUESTED_AT: ${{ steps.restart.outputs.requestedAt }}
        run: |
          # npm ci + pm2 restart usually takes 1–3 minutes.
          for i in $(seq 1 40); do
            sleep 15
            BODY=$(curl -sS -m 20 "${API_BASE}/health" || true)
            COMMIT=$(echo "$BODY" | jq -r '.version.gitCommit // empty' 2>/dev/null)
            STARTED=$(echo "$BODY" | jq -r '.version.processStartedAt // empty' 2>/dev/null)
            echo "[$i] commit=${COMMIT:0:7} processStartedAt=${STARTED}"
            if [ "$COMMIT" = "$GITHUB_SHA" ] && [ -n "$STARTED" ] && [[ "$STARTED" > "$REQUESTED_AT" ]]; then
              echo "✅ pos_admin restarted on ${COMMIT:0:7} at ${STARTED}."
              exit 0
            fi
          done
          echo "::error::pos_admin did not restart on ${GITHUB_SHA:0:7} within 10 minutes — check logs/deploy-restart.log on the server."
          exit 1
